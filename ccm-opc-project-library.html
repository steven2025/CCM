<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>期末任务 · 跨文化应用项目库</title><link rel="stylesheet" href="assets/final-project-library.css?v=20261025-1"></head><body>
<header class="final-header"><div><h1>期末任务 · 跨文化应用项目库</h1><p>浏览项目 → 确认选题 → 下载项目MD → 开发与测试 → 提交作品</p></div><button type="button" id="back">返回主程序</button></header>
<div class="final-account"><span id="account">请从课程主程序登录，浏览项目不需要登录。</span><button type="button" id="refresh">刷新选题与提交记录</button></div><p id="notice" role="status" aria-live="polite"></p>
<div class="final-workspace"><aside class="final-sidebar" aria-label="分类浏览项目"><label>项目浏览<input id="search" type="search" placeholder="搜索项目、场景或功能"></label><button type="button" id="custom-entry">＋ 自拟题目</button><div id="project-nav"></div></aside><main id="project-main" tabindex="-1"><section id="project-detail"></section><section id="submission"></section><section id="teacher" hidden></section></main></div>
<dialog id="submit-dialog"><header><h2>提交期末作品</h2><button type="button" data-close aria-label="关闭">×</button></header><div class="highlight">请核查作品首页的资料作者信息，并填写你自己的<strong>姓名和班级</strong>。完整作品包应包含入口HTML、项目MD、素材及来源清单。另请将全部文件打包，通过<strong>企业微信私信</strong>给老师，便于择优加入课程。</div><form id="submit-form"><p id="submit-identity"></p><p id="submit-topic"></p><label>作品名称（手动填写）<input name="appName" required maxlength="100"></label><label>作品预览链接（不限平台）<input name="appUrl" type="url" maxlength="2000" placeholder="https://… 或 http://…"></label><p class="muted">填写可打开作品的完整HTTP/HTTPS链接。有登录、密码或有效期限制请在下方说明；建议同时交ZIP。</p><label>完整ZIP作品包（最大300MB）<input name="zip" type="file" accept=".zip,application/zip"></label><fieldset id="existing-zip" hidden><legend>已留存的本项目ZIP（可选择复用）</legend><div></div></fieldset><label>访问说明／本次修改说明（可选）<textarea name="notes" maxlength="5000" rows="2" placeholder="如需登录、密码或链接有效期，请说明；否则可留空。"></textarea></label><p class="muted">链接或ZIP至少一项。ZIP私有保存，不会自动变成网站；链接经教师审核后进入课程作业展示。</p><progress max="100" value="0" hidden></progress><p id="submit-status" role="status" aria-live="polite"></p><button class="primary" type="submit">确认提交</button></form></dialog>
<script src="assets/final-projects-data.js?v=20261025-1"></script><script src="assets/final-project-md.js?v=20261025-1"></script><script src="assets/final-project-library.js?v=20261025-1"></script></body></html>
